name: Deploy website Jobs & Artifacts Demo 1
on:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './Jobs & Artifacts/package-lock.json'
      - name: Install dependencies
        run: npm ci
        working-directory: './Jobs & Artifacts'
      - name: Lint code
        run: npm run lint
        working-directory: './Jobs & Artifacts'
      - name: Test code
        run: npm run test
        working-directory: './Jobs & Artifacts'
  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      script-file: ${{ steps.publish-js-filename.outputs.script-file }}
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './Jobs & Artifacts/package-lock.json'
      - name: Install dependencies
        run: npm ci
        working-directory: './Jobs & Artifacts'
      - name: Build website
        run: npm run build
        working-directory: './Jobs & Artifacts'
      - name: Publish JS filename
        id: publish-js-filename
        run: find dist/assets/*.js -type f -execdir echo 'script-file={}' >>$GITHUB_OUTPUT ';'
        working-directory: './Jobs & Artifacts'
      - name: Build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: Jobs & Artifacts/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Get Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-files
      - name: Output contents of dist folder
        run: ls -R
      - name: Output Filename of JS file
        run: echo "JS file: ${{ needs.build.outputs.script-file }}"
      - name: Deploy
        run: echo "Deploying..."