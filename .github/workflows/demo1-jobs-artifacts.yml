name: Deploy website Jobs & Artifacts Demo 1
on:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './Jobs & Artifacts/package-lock.json'
      - name: Install dependencies
        run: npm ci
        working-directory: './Jobs & Artifacts'
      - name: Lint code
        run: npm run lint
        working-directory: './Jobs & Artifacts'
      - name: Test code
        run: npm run test
        working-directory: './Jobs & Artifacts'
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './Jobs & Artifacts/package-lock.json'
      - name: Install dependencies
        run: npm ci
        working-directory: './Jobs & Artifacts'
      - name: Build website
        run: npm run build
        working-directory: './Jobs & Artifacts'
      - name: Build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: Jobs & Artifacts/dist
            # |
            # Jobs & Artifacts/dist
            # Jobs & Artifacts/package.json
  deploy:
    needs: build #Important: This job will only run if the build job is successful
    runs-on: ubuntu-latest
    steps:
      - name: Get Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-files
      - name: Output contents of dist folder
        run: ls
      - name: Deploy
        run: echo "Deploying..."