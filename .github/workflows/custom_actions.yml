name: Custom Actions Workflow
on:
  push:
    branches:
      - main
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Load & Cache Dependencies
        id: cache
        uses: ./.github/workflows/cached-deps
        with:
          caching: 'false'
      - name: Output information
        run: |
          echo "Cache used: ${{ steps.cached-deps.outputs.used-cache }}"
      - name: Lint code
        run: npm run lint
        working-directory: "Composite-Actions"

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Load & Cache Dependencies
        id: cache
        uses: ./.github/workflows/cached-deps
      - name: Test code
        id: run-tests
        run: npm run test
        working-directory: "Composite-Actions"
      - name: Upload test report
        if: failure() && steps.run-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: Composite-Actions/test.json

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Load & Cache Dependencies
        id: cache
        uses: ./.github/workflows/cached-deps
      - name: Build website
        run: npm run build
        working-directory: "Composite-Actions"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: Composite-Actions/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Get build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: ./dist
      - name: Output contents
        run: ls
      - name: Deploy site
        run: echo "Deploying..."
  information: #Corre en paralelo no depende de otros jobs
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Run custom action
        uses: ./.github/workflows/deploy-s3-javascript