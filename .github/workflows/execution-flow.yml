name: Conditional Steps Demo
on:
  push:
    branches:
      - main
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: deps-node-modules-${{ hashFiles('Conditional Steps/package-lock.json') }}
      - name: Install dependencies
        run: npm ci
        working-directory: "Conditional Steps"
      - name: Lint code
        run: npm run lint
        working-directory: "Conditional Steps"
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: deps-node-modules-${{ hashFiles('Conditional Steps/package-lock.json') }}
      - name: Install dependencies
        run: npm ci
        working-directory: "Conditional Steps"
      - name: Test code
        run: npm run test
        working-directory: "Conditional Steps"
      - name: Upload test report
        if:
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: Conditional Steps/test.json
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: deps-node-modules-${{ hashFiles('Conditional Steps/package-lock.json') }}
      - name: Install dependencies
        run: npm ci
        working-directory: "Conditional Steps"
      - name: Build website
        id: build-website
        run: npm run build
        working-directory: "Conditional Steps"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: Conditional Steps/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Get build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-files
      - name: Output contents
        run: ls
      - name: Deploy
        run: echo "Deploying..."